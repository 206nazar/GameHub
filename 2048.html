<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>2048 | GameHub</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      text-align: center;
    }

    #game-container {
      margin: 40px auto;
      width: 320px;
      height: 320px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
    }

    .tile {
      background: rgba(255,255,255,0.07);
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 70px;
      border-radius: 8px;
    }

    #score {
      font-size: 20px;
      margin-top: 10px;
      color: #00eaff;
    }

    .wrapper main {
      padding: 20px;
    }
  </style>
</head>
<body>
<div class="background"></div>
<div class="wrapper">
  <header>
    <div class="logo">🎮 GameHub</div>
    <nav>
      <a href="index.php">Ігри</a>
      <a href="leaderboard.php">Рейтинг</a>
      <a href="profile.php">Профіль</a>
      <a href="logout.php">Вийти</a>
    </nav>
  </header>

  <main>
    <h1>Гра: 2048</h1>
    <div id="score">Рахунок: <span id="scoreVal">0</span></div>
    <div id="game-container"></div>
    <p>Керування: стрілки або W A S D</p>
  </main>

  <footer>
    <p>© 2025 GameHub | Telegram | Контакти</p>
  </footer>
</div>

<script>
const container = document.getElementById("game-container");
const scoreDisplay = document.getElementById("scoreVal");

let board = [];
let score = 0;

function initBoard() {
  board = Array(4).fill().map(() => Array(4).fill(0));
  addRandomTile();
  addRandomTile();
  drawBoard();
}

function addRandomTile() {
  let empty = [];
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      if (board[r][c] === 0) empty.push([r, c]);
    }
  }
  if (empty.length > 0) {
    let [r, c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
  }
}

function drawBoard() {
  container.innerHTML = "";
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.textContent = board[r][c] === 0 ? "" : board[r][c];
      container.appendChild(tile);
    }
  }
  scoreDisplay.textContent = score;
}

function move(dir) {
  let moved = false;
  let addScore = 0;

  const combine = row => {
    let arr = row.filter(val => val !== 0);
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i+1]) {
        arr[i] *= 2;
        addScore += arr[i];
        arr[i+1] = 0;
      }
    }
    return arr.filter(val => val !== 0).concat(Array(4 - arr.filter(val => val !== 0).length).fill(0));
  }

  let newBoard = board.map(r => r.slice());

  if (dir === "left" || dir === "right") {
    for (let r = 0; r < 4; r++) {
      let row = board[r].slice();
      if (dir === "right") row.reverse();
      row = combine(row);
      if (dir === "right") row.reverse();
      if (JSON.stringify(row) !== JSON.stringify(board[r])) moved = true;
      newBoard[r] = row;
    }
  } else {
    for (let c = 0; c < 4; c++) {
      let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
      if (dir === "down") col.reverse();
      col = combine(col);
      if (dir === "down") col.reverse();
      for (let r = 0; r < 4; r++) {
        if (board[r][c] !== col[r]) moved = true;
        newBoard[r][c] = col[r];
      }
    }
  }

  if (moved) {
    board = newBoard;
    score += addScore;
    addRandomTile();
    drawBoard();
  }

  if (isGameOver()) {
    setTimeout(() => {
      alert("Гру завершено! Рахунок: " + score);
      sendScore(score);
    }, 300);
  }
}

function isGameOver() {
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      if (board[r][c] === 0) return false;
      if (c < 3 && board[r][c] === board[r][c+1]) return false;
      if (r < 3 && board[r][c] === board[r+1][c]) return false;
    }
  }
  return true;
}

document.addEventListener("keydown", e => {
  switch (e.key.toLowerCase()) {
    case "arrowup": case "w": move("up"); break;
    case "arrowdown": case "s": move("down"); break;
    case "arrowleft": case "a": move("left"); break;
    case "arrowright": case "d": move("right"); break;
  }
});

function sendScore(score) {
  fetch("save_score.php", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      game_code: "2048",
      score: score
    })
  })
  .then(res => res.text())
  .then(data => console.log("Score saved:", data))
  .catch(err => console.error("Error saving score:", err));
}

initBoard();
</script>
</body>
</html>
